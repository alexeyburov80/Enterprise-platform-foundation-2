# =============================================================================
# Dp.Platform MVP — мульти-контейнерное развертывание (ревью #2: «всё в одном
# докере — плохо»). Каждый сервис и каждый имитатор — отдельный контейнер.
# Замещение 1С/Битрикс: адаптеры в режиме auto сами уходят на свои имитаторы.
# =============================================================================

name: dp-platform

services:
  # ---------------------------------------------------------------- инфраструктура
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dp
      POSTGRES_PASSWORD: dp
      POSTGRES_DB: dp
    ports:
      - "5433:5432" # host 5433, чтобы не конфликтовать с локальным postgres
    volumes:
      - dp-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dp -d dp"]
      interval: 5s
      timeout: 3s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: dp
      RABBITMQ_DEFAULT_PASS: dp
    ports:
      - "5672:5672"
      - "15672:15672" # management UI (dp/dp)
    volumes:
      - dp-rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------- миграции
  # Однократный прогон: forward-only миграции + журнал dp_meta.migration_journal.
  migrator:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Migrator
    command: ["dotnet", "Dp.Platform.Migrator.dll", "/app/migrations"]
    environment:
      DP_MIGRATOR__CONNECTION: Host=postgres;Port=5432;Database=dp;Username=dp;Password=dp
    volumes:
      - ./db/migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------- платформа
  # Реестр схем: SD DSL v1, версии, матрица совместимости.
  registry:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Registry
        APP_DLL: Dp.Platform.Registry.dll
    environment:
      ConnectionStrings__Registry: Host=postgres;Port=5432;Database=dp;Username=dp;Password=dp
    ports:
      - "8081:8080"
    healthcheck: &http-health
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      migrator:
        condition: service_completed_successfully

  # Data Access API: 9 операций + Query DSL + Extension DTO.
  data:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Data
        APP_DLL: Dp.Platform.Data.dll
    environment:
      ConnectionStrings__Data: Host=postgres;Port=5432;Database=dp;Username=dp;Password=dp
      Registry__BaseUrl: http://registry:8080
    ports:
      - "8082:8080"
    healthcheck: *http-health
    depends_on:
      migrator:
        condition: service_completed_successfully

  # Content-addressed файловое хранилище (SHA-256, blobs/ab/cd/).
  files:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Files
        APP_DLL: Dp.Platform.Files.dll
    environment:
      ConnectionStrings__Files: Host=postgres;Port=5432;Database=dp;Username=dp;Password=dp
      Files__DataRoot: /data/blobs
    ports:
      - "8083:8080"
    volumes:
      - dp-files:/data/blobs
    healthcheck: *http-health
    depends_on:
      migrator:
        condition: service_completed_successfully

  # CDC: транзакционный outbox -> RabbitMQ (dp.data.changed.v1).
  cdc:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Cdc
        APP_DLL: Dp.Platform.Cdc.dll
    environment:
      ConnectionStrings__Cdc: Host=postgres;Port=5432;Database=dp;Username=dp;Password=dp
      Rabbit__ConnectionString: amqp://dp:dp@rabbitmq:5672/%2F
      Cdc__RegistryBaseUrl: http://registry:8080
    ports:
      - "8084:8080"
    healthcheck: *http-health
    depends_on:
      migrator:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # ---------------------------------------------------------------- адаптеры
  # Универсальный шаблон: 1 контейнер = 1 интеграционная система.
  # Mode=auto: если реальная 1С недоступна (по умолчанию её и нет) —
  # трафик автоматически уходит на наш имитатор stub-1c. Замещение без правки кода.
  adapter-1c:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Adapter.OneC
        APP_DLL: Dp.Platform.Adapter.OneC.dll
    environment:
      Upstream__Mode: ${ADAPTER_1C_MODE:-auto} # auto | real | stub
      Upstream__PrimaryUrl: ${ADAPTER_1C_PRIMARY_URL:-http://1c-real:8080}
      Upstream__FallbackUrl: http://stub-1c:8080
      Upstream__ProbePath: /health
    ports:
      - "8085:8080"
    healthcheck: *http-health
    depends_on:
      stub-1c:
        condition: service_started

  adapter-bitrix:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Adapter.Bitrix
        APP_DLL: Dp.Platform.Adapter.Bitrix.dll
    environment:
      Upstream__Mode: ${ADAPTER_BITRIX_MODE:-auto}
      Upstream__PrimaryUrl: ${ADAPTER_BITRIX_PRIMARY_URL:-http://bitrix-real:8080}
      Upstream__FallbackUrl: http://stub-bitrix:8080
      Upstream__ProbePath: /health
    ports:
      - "8086:8080"
    healthcheck: *http-health
    depends_on:
      stub-bitrix:
        condition: service_started

  # ---------------------------------------------------------------- имитаторы
  # Каждый имитатор — строго свой контейнер (требование ревью).
  stub-1c:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Stub.OneC
        APP_DLL: Dp.Platform.Stub.OneC.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8091:8080" # открыт наружу: можно «играть» с OData напрямую
    healthcheck: *http-health

  stub-bitrix:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Stub.Bitrix
        APP_DLL: Dp.Platform.Stub.Bitrix.dll
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      StubBitrix__WebhookKey: ${STUB_BITRIX_KEY:-demo}
    ports:
      - "8092:8080"
    healthcheck: *http-health

  # ---------------------------------------------------------------- шлюз
  # Единая точка входа: маршрутизация по префиксам + агрегированный health.
  gateway:
    build:
      context: .
      args:
        PROJECT_PATH: Dp.Platform.Gateway
        APP_DLL: Dp.Platform.Gateway.dll
    environment:
      Gateway__ApiToken: ${DP_API_TOKEN:-dp-dev-token}
      Gateway__Routes__/api/v1/schema: http://registry:8080
      Gateway__Routes__/api/v1/stores: http://registry:8080
      Gateway__Routes__/api/v1/data: http://data:8080
      Gateway__Routes__/api/v1/files: http://files:8080
      Gateway__Routes__/api/v1/int/1c: http://adapter-1c:8080
      Gateway__Routes__/api/v1/int/bitrix: http://adapter-bitrix:8080
      Gateway__Services__gateway: http://gateway:8080
      Gateway__Services__registry: http://registry:8080
      Gateway__Services__data: http://data:8080
      Gateway__Services__files: http://files:8080
      Gateway__Services__cdc: http://cdc:8080
      Gateway__Services__adapter-1c: http://adapter-1c:8080
      Gateway__Services__adapter-bitrix: http://adapter-bitrix:8080
      Gateway__Services__stub-1c: http://stub-1c:8080
      Gateway__Services__stub-bitrix: http://stub-bitrix:8080
    ports:
      - "8080:8080" # ЕДИНАЯ точка входа платформы
    healthcheck: *http-health
    depends_on:
      - registry
      - data
      - files
      - cdc
      - adapter-1c
      - adapter-bitrix

volumes:
  dp-postgres:
  dp-rabbitmq:
  dp-files:
