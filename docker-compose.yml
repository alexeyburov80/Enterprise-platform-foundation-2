# ============================================================================
# Локальный стенд Data Platform MVP — каждый компонент в СВОЁМ контейнере
# (полностью офлайн после первичной загрузки образов).
#
# Контур (6 сервисов):
#   dp-api          :8080  — Data Access API (/dp/v1, 9 операций) + admin
#   dp-sync         :8090  — интеграционный воркер: адаптеры 1С/Битрикс,
#                            режимы auto|real|stub, outbox → RabbitMQ
#   imitator-1c     :8081  — НАШ сервис-заместитель 1С (OData)
#   imitator-bitrix :8082  — НАШ сервис-заместитель Битрикс24 (webhook REST)
#   postgres        :5432  — хранилище logical store'ов + dp.outbox
#   rabbitmq        :5672/15672 — события dp.data.changed.v1
#
# Первичный запуск: docker compose up -d --build (единократно нужна сеть:
# образы + NuGet). Далее весь контур работает без доступа в интернет.
#
# Режим интеграции по умолчанию — auto: если реальная 1С/Битрикс недоступна
# (RealBaseUrl не отвечает), dp-sync transparentно замещает её собственными
# сервисами imitator-1c / imitator-bitrix (fallback фиксируется в
# GET /admin/adapters). Подключить «реальные» системы:
#   docker compose -f docker-compose.yml -f docker-compose.real.yml up -d
# ============================================================================

name: dp-mvp

services:
  postgres:
    image: postgres:16-alpine
    container_name: dp-postgres
    environment:
      POSTGRES_USER: dp
      POSTGRES_PASSWORD: dp-dev-secret
      POSTGRES_DB: dp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dp -d dp"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: dp-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # UI (guest / guest)
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # dp-api — публичный API. Про интеграционные системы НЕ знает вообще:
  # адаптеры и синхронизация живут в dp-sync (управление — через прокси).
  # ---------------------------------------------------------------------------
  dp-api:
    build:
      context: .
      dockerfile: src/Dp.Api/Dockerfile
    container_name: dp-api
    ports:
      - "8080:8080"    # API + Swagger UI (/swagger)
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=dp;Username=dp;Password=dp-dev-secret"
      Sd__Path: /app/sd
      Migrations__AutoApply: "true"       # dp-api применяет миграции (журнал dp.migration_journal)
      Auth__ApiKey: dev-key
      Worker__BaseUrl: http://dp-sync:8080
      Worker__ApiKey: dev-key
    volumes:
      - ./deploy/sd:/app/sd:ro
    depends_on:
      postgres:
        condition: service_healthy
      dp-sync:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # dp-sync — интеграционный воркер: коннекторы 1С/Битрикс, auto/real/stub,
  # fallback на имитаторы, outbox publisher → RabbitMQ. Схему БД не мигрирует —
  # ждёт dp-api. Порт 8090 наружу только для наблюдаемости (GET /health,
  # GET /adapters); в проде держать в изолированной сети.
  # ---------------------------------------------------------------------------
  dp-sync:
    build:
      context: .
      dockerfile: src/Dp.Sync/Dockerfile
    container_name: dp-sync
    ports:
      - "8090:8080"    # внутреннее API воркера (health/adapters/run) — для отладки
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Db: "Host=postgres;Port=5432;Database=dp;Username=dp;Password=dp-dev-secret"
      Sd__Path: /app/sd
      Auth__ApiKey: dev-key
      Rabbit__Host: rabbitmq
      Rabbit__Port: "5672"
      Rabbit__User: guest
      Rabbit__Pass: guest
      Rabbit__Exchange: dp.data
      Sync__AutoIntervalSeconds: "0"      # >0 — автосинк по расписанию, 0 — вручную
      # --- интеграционные системы: режим auto = real при доступности,
      #     иначе наш сервис-заместитель (imitator-*) ---------------------------
      Integration__Systems__1c__Mode: auto
      Integration__Systems__1c__RealBaseUrl: http://real-1c:8080
      Integration__Systems__1c__StubBaseUrl: http://imitator-1c:8080
      Integration__Systems__1c__User: svc_dp
      Integration__Systems__1c__Password: dp-secret
      Integration__Systems__bitrix__Mode: auto
      Integration__Systems__bitrix__RealBaseUrl: http://real-bitrix:8080
      Integration__Systems__bitrix__StubBaseUrl: http://imitator-bitrix:8080
      Integration__Systems__bitrix__WebhookKey: webhook-dev-key
    volumes:
      - ./deploy/sd:/app/sd:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      imitator-1c:
        condition: service_started
      imitator-bitrix:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------------------
  # НАШИ сервисы-заместители внешних систем (каждый в своём контейнере).
  # Именно они используются, когда реальной 1С/Битрикс нет, и в режиме stub.
  # ---------------------------------------------------------------------------
  imitator-1c:
    build:
      context: ./src/Dp.Imitator1C
      dockerfile: Dockerfile
    container_name: dp-imitator-1c
    ports:
      - "8081:8080"    # OData-подобный REST 1С + GET /health
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Data__DelayMs: "120"
      Data__FailRate: "0"
      Data__Revision: "0"
      Integration__User: svc_dp
      Integration__Password: dp-secret
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 3s
      retries: 10

  imitator-bitrix:
    build:
      context: ./src/Dp.ImitatorBitrix
      dockerfile: Dockerfile
    container_name: dp-imitator-bitrix
    ports:
      - "8082:8080"    # Bitrix24 webhook REST + GET /health
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Data__DelayMs: "120"
      Data__FailRate: "0"
      Data__Revision: "0"
      Auth__Key: webhook-dev-key
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/localhost/8080'"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  rabbitdata:
